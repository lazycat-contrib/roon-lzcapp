ext_config:
  enable_document_access: true
  enable_media_access: true
application:
  subdomain: roon
  background_task: true
  multi_instance: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: file:///lzcapp/pkg/content/
services:
  roon:
    # upstream: czyt/roon:v2.52.1538
    image: registry.lazycat.cloud/czyt/czyt/roon:a13e1221b1b468c9
    user: root
    binds:
      - /lzcapp/run/mnt/home/music:/music
      - /lzcapp/var/data:/var/roon
      - /lzcapp/var/backup:/backup
    netadmin: true
    network_mode: host
